name: Production Backend Smoke

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/server/**'
      - 'scripts/alpha-smoke.mjs'
      - 'package.json'

concurrency:
  group: carry-production-smoke
  cancel-in-progress: true

jobs:
  gutter-golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Vercel production and run golden path
        env:
          CARRY_API_URL: https://carry-gilt.vercel.app
        run: |
          sleep 35
          for attempt in 1 2 3; do
            echo "Smoke attempt $attempt"
            if npm run smoke:alpha; then
              exit 0
            fi
            sleep 20
          done
          exit 1
