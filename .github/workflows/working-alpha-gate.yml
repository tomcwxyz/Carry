name: Working Alpha Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/release-gate.mjs'
      - '.github/workflows/working-alpha-gate.yml'
      - '.eas/working-alpha-gate-trigger'

concurrency:
  group: carry-working-alpha-gate
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic spoken voice fixture
        run: |
          if command -v espeak-ng >/dev/null 2>&1; then
            SPEAK=espeak-ng
          elif command -v espeak >/dev/null 2>&1; then
            SPEAK=espeak
          else
            sudo apt-get install -y -qq espeak-ng
            SPEAK=espeak-ng
          fi
          "$SPEAK" -v en-gb -s 145 -w /tmp/carry-gutter-test.wav "My gutter is blocked"
          test -s /tmp/carry-gutter-test.wav
          file /tmp/carry-gutter-test.wav
      - name: Run reliability and voice gate against production
        env:
          CARRY_API_URL: https://carry-gilt.vercel.app
          CARRY_VOICE_FIXTURE: /tmp/carry-gutter-test.wav
        run: npm run gate:alpha
