name: Android Alpha APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .eas/android-alpha-trigger

permissions:
  contents: write

jobs:
  build:
    name: Build signed Android alpha locally
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Carry
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN. Add it in GitHub Settings → Secrets and variables → Actions before running this workflow."
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Link or create EAS project
        run: eas init --force --non-interactive

      - name: Build standalone APK on GitHub runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile alpha \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/Carry-alpha.apk"

      - name: Verify APK
        run: |
          test -s Carry-alpha.apk
          ls -lh Carry-alpha.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carry-Android-Alpha
          path: Carry-alpha.apk
          if-no-files-found: error

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: carry-android-alpha-${{ github.run_number }}
        run: |
          NOTES="Standalone Android alpha built and signed on GitHub Actions.\n\nInstall Carry-alpha.apk directly on an Android test device.\n\nCommit: $GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Carry-alpha.apk --clobber
          else
            gh release create "$TAG" Carry-alpha.apk \
              --target "$GITHUB_SHA" \
              --title "Carry Android Alpha #${{ github.run_number }}" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Build summary
        run: |
          echo "## Carry Android Alpha" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Standalone APK built locally on the GitHub runner against https://carry-gilt.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK is attached to the GitHub pre-release **carry-android-alpha-${{ github.run_number }}**." >> "$GITHUB_STEP_SUMMARY"
